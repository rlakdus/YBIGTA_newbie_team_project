name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ]  

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64  
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ybigta-project:latest

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push  
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and Run Container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ybigta-project:latest
            
            sudo docker rm -f my-api-server || true
            
            sudo docker run -d \
              --name my-api-server \
              -v /home/ec2-user:/data \
              --env-file /home/ec2-user/.env \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/ybigta-project:latest
            
            sudo docker image prune -f
