name: Deploy to EC2

on:
  push:
    branches:
      - main  # 혹은 master (팀의 메인 브랜치 이름 확인)

jobs:
  # Job 1: Docker 이미지 빌드 및 푸시
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ybigta-assignment:latest # 레포 이름은 자유

  # Job 2: EC2에 배포
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ybigta-assignment:latest
            sudo docker stop ybigta-container || true
            sudo docker rm ybigta-container || true
            sudo docker run -d --name ybigta-container -p 80:8000 \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/ybigta-assignment:latest